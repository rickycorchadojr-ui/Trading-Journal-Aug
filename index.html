<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#191919">
<title>MNQ Trading Journal</title>
<style>
/* ============ Notion dark-mode tokens ============ */
:root{
  --bg:#191919;
  --bg-elev:#202020;
  --bg-modal:#252525;
  --hover:rgba(255,255,255,.055);
  --hover-strong:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.094);
  --line-soft:rgba(255,255,255,.055);
  --text:rgba(255,255,255,.81);
  --text-mid:rgba(255,255,255,.60);
  --text-dim:rgba(255,255,255,.443);
  --text-faint:rgba(255,255,255,.282);
  --accent:#2383e2;
  --accent-hover:#2b8ff0;
  /* tag palette (Notion dark) */
  --t-green-bg:rgba(45,170,90,.22);   --t-green:#59d98d;
  --t-red-bg:rgba(235,87,87,.20);     --t-red:#ff7369;
  --t-blue-bg:rgba(45,114,210,.24);   --t-blue:#7cb0f5;
  --t-pink-bg:rgba(220,110,175,.20);  --t-pink:#e491c6;
  --t-gold-bg:rgba(203,145,47,.22);   --t-gold:#e6c15b;
  --t-orange-bg:rgba(217,115,45,.22); --t-orange:#e2975c;
  --t-purple-bg:rgba(160,110,220,.22);--t-purple:#c79ef0;
  --t-gray-bg:rgba(255,255,255,.06);  --t-gray:rgba(255,255,255,.66);
  /* chart hues */
  --c-blue:#529bff; --c-green:#4dd58a; --c-red:#ff6b6b;
  --c-purple:#b483e8; --c-orange:#e2975c; --c-gold:#e6c15b;
  --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,"Cascadia Mono","Roboto Mono",monospace;
  --radius:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;color:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pos{color:var(--c-green)} .neg{color:var(--c-red)}
svg text{font-family:var(--mono)}

/* ============ Shell ============ */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 120px}
header.top{display:flex;align-items:center;gap:14px;padding:22px 0 6px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:9px;font-size:26px;font-weight:700;letter-spacing:-.5px;color:#fff}
.title .ico{font-size:22px;filter:grayscale(.15)}
.spacer{flex:1 1 auto}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--radius);
  background:var(--hover);color:var(--text);font-size:13.5px;transition:background .12s}
.tbtn:hover{background:var(--hover-strong)}
.tbtn svg{width:15px;height:15px;opacity:.8}
.tbtn.primary{background:var(--accent);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--accent-hover)}
.sub{color:var(--text-dim);font-size:12.5px;padding:2px 0 14px}
.filterbar{display:flex;align-items:center;gap:8px;padding:12px 0 2px}
.filterbar .flab{color:var(--text-dim);font-size:12px;margin-right:2px}
.filterbar select{height:32px;background:var(--bg-elev);border:1px solid var(--line);border-radius:7px;color:var(--text);
  font-family:var(--mono);font-size:13px;padding:0 10px;cursor:pointer}
.filterbar select:focus{outline:none;border-color:var(--accent)}
.filterbar select:hover{background:#242424}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:9px 11px 11px;font-size:14px;
  color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.tab svg{width:15px;height:15px;opacity:.75}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.view{padding-top:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ Pills (Notion tags) ============ */
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;font-size:12.5px;
  line-height:1;white-space:nowrap;letter-spacing:.2px}
.pill.green{background:var(--t-green-bg);color:var(--t-green)}
.pill.red{background:var(--t-red-bg);color:var(--t-red)}
.pill.blue{background:var(--t-blue-bg);color:var(--t-blue)}
.pill.pink{background:var(--t-pink-bg);color:var(--t-pink)}
.pill.gold{background:var(--t-gold-bg);color:var(--t-gold)}
.pill.orange{background:var(--t-orange-bg);color:var(--t-orange)}
.pill.gray{background:var(--t-gray-bg);color:var(--t-gray)}

/* ============ Table (List overview) ============ */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl thead th{text-align:left;font-weight:400;color:var(--text-dim);font-size:13px;padding:7px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th .hd{display:inline-flex;align-items:center;gap:6px}
.tbl thead th svg{width:14px;height:14px;opacity:.6}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .pair{color:#fff;display:inline-flex;align-items:center;gap:8px}
.tbl .clip{display:inline-block;width:13px;height:13px;opacity:.5}
.cols-scroll{overflow-x:auto;scrollbar-width:thin}
tfoot td{padding:9px 12px;color:var(--text-dim);font-size:13px;border-top:1px solid var(--line)}
tfoot .num{color:var(--text)}
.check-ok{color:var(--c-green)} .check-no{color:var(--text-faint)}

/* ============ Board (Wins / Strategy) ============ */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.bcol{flex:0 0 265px;min-width:265px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-size:13.5px}
.bcol-h .count{color:var(--text-faint);font-size:12.5px}
.bcol-h .sum{margin-left:auto;font-size:12.5px}
.card{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:8px;padding:10px 11px;margin-bottom:8px;
  cursor:pointer;transition:background .1s,border-color .1s}
.card:hover{background:#242424;border-color:var(--line)}
.card .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .r+.r{margin-top:8px}
.card .name{color:#fff;font-size:14px;font-weight:600}
.card .meta{color:var(--text-dim);font-size:12.5px}
.card .cover{width:100%;height:96px;border-radius:6px;object-fit:cover;margin-bottom:9px;background:#111;
  border:1px solid var(--line-soft)}

/* ============ Calendar ============ */
.cal-h{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.cal-h .m{font-size:17px;color:#fff;font-weight:600;min-width:170px}
.nav{display:inline-flex;gap:2px}
.nav button{width:30px;height:30px;border-radius:5px;background:var(--hover);display:grid;place-items:center;font-size:15px}
.nav button:hover{background:var(--hover-strong)}
.today-btn{height:30px;padding:0 11px;border-radius:5px;background:var(--hover);font-size:13px}
.today-btn:hover{background:var(--hover-strong)}
.cal .wkhdr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal .wd{padding:2px 8px;font-size:11px;color:var(--text-dim)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cell{min-height:92px;padding:8px 9px;border-radius:10px;position:relative;cursor:pointer;
  background:var(--bg-elev);border:1px solid var(--line-soft);transition:border-color .1s}
.cal .cell:hover{border-color:var(--line)}
.cal .cell.out{background:transparent;border:none;cursor:default;min-height:0}
.cal .cell.empty{background:rgba(255,255,255,.018);border-color:transparent}
.cal .cell.empty:hover{border-color:var(--line-soft)}
.cal .cell.green{background:rgba(45,170,90,.14);border-color:rgba(45,170,90,.34)}
.cal .cell.red{background:rgba(235,87,87,.12);border-color:rgba(235,87,87,.32)}
.cal .dn{font-size:12px;color:var(--text-dim);position:absolute;top:7px;left:9px}
.cal .cell.green .dn,.cal .cell.red .dn{color:var(--text-mid)}
.cal .daybody{margin-top:24px;text-align:center}
.cal .daybody .amt{font-size:15px;font-weight:700}
.cal .daybody .sub{font-size:10px;color:var(--text-faint);margin-top:2px}
@media(max-width:720px){
  .cal .cell{min-height:72px;padding:6px 7px}
  .cal .daybody{margin-top:20px}
  .cal .daybody .amt{font-size:13px}
  .cal .daybody .sub{display:none}
}

/* ============ Gallery ============ */
.gal-grp{margin-bottom:26px}
.gal-grp h4{margin:0 0 12px;font-size:13.5px;font-weight:400;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.gal{columns:190px;column-gap:8px}
@media(min-width:900px){.gal{columns:220px}}
.gcard{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;cursor:pointer;
  break-inside:avoid;margin:0 0 8px;position:relative;transition:border-color .12s}
.gcard:hover{border-color:var(--line)}
.gcard img.shot{width:100%;height:auto;display:block}
.gcard .ph{aspect-ratio:16/10;background:#141414;display:grid;place-items:center;color:var(--text-faint);
  font-size:11.5px;border-bottom:1px solid var(--line-soft)}
.gcard .cnt{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.66);color:#fff;font-size:10.5px;
  padding:2px 7px;border-radius:20px}
.gcard .bd{padding:8px 10px}
.gcard .bd .r{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.gcard .bd .r+.r{margin-top:5px}
.gcard .nm{color:#fff;font-weight:600;font-size:13.5px}

/* ============ Dashboard ============ */
.dash{display:flex;flex-direction:column;gap:26px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:720px){.rings{grid-template-columns:repeat(2,1fr)}}
.ring-card{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:12px;padding:16px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.ring-card .cap{color:var(--text-dim);font-size:12.5px;margin-top:2px}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px}
.acctcard{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:12px;padding:14px 15px}
.acctcard .ah{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.acctcard .an{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#fff;font-weight:600}
.acctcard .an .dot{width:9px;height:9px;border-radius:50%}
.acctcard .acsel{height:24px;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--text-dim);font-size:11px;font-family:var(--mono);padding:0 4px}
.acctcard .anet{margin-left:auto;font-size:16px;font-weight:700}
.acctcard .abal{font-size:12.5px;color:var(--text);margin-bottom:11px}
.acctcard .arow{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:9px;margin-bottom:8px;font-size:11px}
.acctcard .al{color:var(--text-dim)}
.acctcard .av{color:var(--text-mid);white-space:nowrap}
.acctcard .abar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.acctcard .afill{height:100%;border-radius:4px;transition:width .4s}
.acctcard .afill.dd{background:var(--c-green)}
.acctcard .afill.ddlow{background:var(--c-red)}
.acctcard .afill.tg{background:var(--c-blue)}
.acctcard .afill.done{background:var(--c-green)}
.acctcard .acfg{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.acctcard .acfg label{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--text-faint);flex:1;min-width:62px;letter-spacing:.3px}
.acctcard .ci{height:26px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:#fff;font-size:12px;font-family:var(--mono);padding:0 7px;width:100%}
.acctcard .ci:focus,.acctcard .acsel:focus{outline:none;border-color:var(--accent)}
.panel{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px}
.panel h3{margin:0 0 16px;font-size:13.5px;font-weight:400;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:11px;overflow:hidden}
@media(max-width:720px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.statcell{background:var(--bg-elev);padding:13px 14px}
.statcell .k{color:var(--text-dim);font-size:11px;letter-spacing:.3px}
.statcell .val{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
.capinput{background:var(--bg);border:1px solid var(--line);border-radius:6px;height:30px;padding:0 8px;width:100%;max-width:130px;color:#fff;font-size:15px;margin-top:5px}
.capinput:focus{border-color:var(--accent);outline:none}

/* vertical bars */
.vbars{display:flex;align-items:flex-end;gap:22px;height:190px;padding:0 6px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbar .track{width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.vbar .fill{width:46px;max-width:70%;border-radius:5px 5px 0 0;transition:height .4s cubic-bezier(.2,.7,.3,1)}
.vbar .val{font-size:12.5px;margin-bottom:5px}
.vbar .lab{color:var(--text-dim);font-size:12px;margin-top:9px;text-align:center}

/* horizontal bars (centered zero) */
.hbars{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:82px 1fr 86px;align-items:center;gap:10px;font-size:12.5px}
.hrow .d{color:var(--text-dim);text-align:right;white-space:nowrap}
.hrow .v{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;white-space:nowrap;font-size:12px}
.hrow .v .vp{color:var(--text-faint);font-size:10.5px}
.hbar{position:relative;height:16px;background:linear-gradient(90deg,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px))}
.hbar .b{position:absolute;top:0;height:100%;border-radius:2px;transition:width .4s cubic-bezier(.2,.7,.3,1)}

/* line / equity */
.linewrap{width:100%;overflow:hidden}
svg.line{width:100%;height:auto;max-height:340px;display:block}

/* empty */
.empty{color:var(--text-dim);font-size:14px;padding:60px 10px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}

/* ============ Journal (day document) ============ */
.jhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.jhead .d{font-size:18px;font-weight:700;color:#fff}
.jhead .tot{margin-left:auto;font-size:12.5px;color:var(--text-dim)}
.jdoc{max-width:760px}
.jblock{position:relative;margin:0 0 14px}
.jblock .bdel{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.55);
  color:var(--text-dim);font-size:12px;display:grid;place-items:center;opacity:0;transition:opacity .12s;z-index:2}
.jblock:hover .bdel{opacity:1}
.jblock .bdel:hover{background:rgba(0,0,0,.8);color:#fff}
.jtext{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:15px;
  line-height:1.6;resize:none;padding:2px 0;min-height:26px;overflow:hidden}
.jtext:focus{outline:none}
.jtext::placeholder{color:var(--text-faint)}
.jimg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line-soft);cursor:zoom-in}
.jtstrip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 9px;border-radius:9px;
  background:var(--bg-elev);border:1px solid var(--line-soft);font-size:12.5px}
.jtstrip .tnum{color:var(--text-faint);font-weight:700;min-width:26px;text-align:center}
.jtstrip .ti{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:#fff;
  font-family:var(--mono);font-size:12.5px;padding:0 7px;max-width:100%}
.jtstrip .ti:focus{outline:none;border-color:var(--accent)}
.jtstrip input.ti.time{width:60px}
.jtstrip input.ti.pnl{width:80px}
.jtstrip input.ti.dur{width:60px}
.jtstrip input.ti.qty{width:46px;text-align:center}
.jtstrip select.ti{padding:0 4px}
.jtstrip .imm{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:6px;
  background:var(--bg);border:1px solid var(--line);color:var(--text-dim);cursor:pointer;user-select:none}
.jtstrip .imm input{margin:0}
.jtstrip .emo{font-size:14px;width:46px;text-align:center}
.jtstrip .del{margin-left:auto;color:var(--t-red);background:transparent;border:none;font-size:14px;padding:0 6px;cursor:pointer}
.jadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.jadd button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;
  background:var(--hover);color:var(--text);font-size:13px}
.jadd button:hover{background:var(--hover-strong)}
.jadd button svg{width:14px;height:14px;opacity:.8}

/* ============ Modal ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:none;z-index:50;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:var(--bg-modal);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-h .t{font-size:16px;font-weight:600;color:#fff}
.modal-h .pnl{margin-left:auto;font-size:18px;font-weight:700}
.modal-h .x{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--hover);font-size:16px}
.modal-h .x:hover{background:var(--hover-strong)}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:15px}
.f{display:flex;flex-direction:column;gap:7px}
.f>label{color:var(--text-dim);font-size:12.5px;letter-spacing:.2px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inp{height:40px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 11px;width:100%;color:#fff}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{height:auto;min-height:58px;padding:9px 11px;resize:vertical;line-height:1.45}
/* segmented */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:6px;font-size:13.5px;color:var(--text-dim);transition:background .12s,color .12s}
.seg button.on{color:#fff}
.seg button.on[data-v=WIN],.seg button.on[data-v=Long]{background:var(--t-green-bg);color:var(--t-green)}
.seg button.on[data-v=LOSS],.seg button.on[data-v=Short]{background:var(--t-red-bg);color:var(--t-red)}
/* strategy chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:13px;
  color:var(--text-dim);transition:.12s}
.chip.on.blue{background:var(--t-blue-bg);color:var(--t-blue);border-color:transparent}

<script>
"use strict";
/* ================= constants ================= */
const MULT = 2;                       // MNQ: $2 per point per contract
const HUE = {blue:"#529bff", green:"#4dd58a", red:"#ff6b6b", purple:"#b483e8", orange:"#e2975c", gold:"#e6c15b"};
const ACCTS = [
  {k:"ts1",  name:"TopstepX #1", color:HUE.blue,   cls:"blue",   rt:1.22},
  {k:"ts2",  name:"TopstepX #2", color:HUE.purple, cls:"purple", rt:1.22},
  {k:"apex", name:"Apex",        color:HUE.orange, cls:"orange", rt:1.04},
];
const DEFAULT_ACCOUNTS={
  ts1:{phase:"Combine",   size:50000, maxDD:2000, target:3000},
  ts2:{phase:"Combine",   size:50000, maxDD:2000, target:3000},
  apex:{phase:"Evaluation",size:50000, maxDD:2500, target:3000}
};
function acctCfg(k){ return ((state.settings.accounts||{})[k])||{phase:"",size:0,maxDD:0,target:0}; }
function accountStats(k){
  const cfg=acctCfg(k);
  const size=Number(cfg.size)||0, maxDD=Number(cfg.maxDD)||0, target=Number(cfg.target)||0;
  let run=0,peak=0;
  sortedTrades().forEach(t=>{ run+=acctPnl(t,k)-acctComm(t,k); if(run>peak)peak=run; });
  const net=run, balance=size+net, peakBalance=size+Math.max(0,peak);
  const ddFloor=peakBalance-maxDD, ddRemaining=balance-ddFloor;
  const ddRemPct=maxDD>0?Math.min(100,Math.max(0,ddRemaining/maxDD*100)):0;
  const targetPct=target>0?Math.max(0,net/target*100):0;
  return {cfg,size,maxDD,target,net,balance,peakBalance,ddFloor,ddRemaining,ddRemPct,targetPct,hit:target>0&&net>=target};
}
function accountCard(a){
  const s=accountStats(a.k), cfg=s.cfg, tpct=Math.min(100,s.targetPct);
  return `<div class="acctcard">
    <div class="ah">
      <span class="an"><span class="dot" style="background:${a.color}"></span>${a.name}</span>
      <select class="acsel" data-acfg="${a.k}" data-fld="phase">${opt(["Combine","Evaluation","Funded","PA"],cfg.phase)}</select>
      <span class="anet num ${cls(s.net)}">${money(s.net)}</span>
    </div>
    <div class="abal num">Balance ${money(s.balance)} <span style="color:var(--text-faint)">/ ${money(s.size)}</span></div>
    <div class="arow"><span class="al">Drawdown</span>
      <div class="abar"><div class="afill ${s.ddRemPct<30?'ddlow':'dd'}" style="width:${s.ddRemPct}%"></div></div>
      <span class="av num">${money(s.ddRemaining)} left</span></div>
    <div class="arow"><span class="al">Target</span>
      <div class="abar"><div class="afill ${s.hit?'done':'tg'}" style="width:${tpct}%"></div></div>
      <span class="av num">${Math.round(s.targetPct)}%${s.hit?" ✓":""}</span></div>
    <div class="acfg">
      <label>Size<input class="ci num" data-acfg="${a.k}" data-fld="size" inputmode="numeric" value="${s.size}"></label>
      <label>Max DD<input class="ci num" data-acfg="${a.k}" data-fld="maxDD" inputmode="numeric" value="${s.maxDD}"></label>
      <label>Target<input class="ci num" data-acfg="${a.k}" data-fld="target" inputmode="numeric" value="${s.target}"></label>
    </div></div>`;
}
const STRATS = {
  "Strategy #1":{cls:"blue", hue:HUE.blue},
  "Strategy #2":{cls:"pink", hue:"#e491c6"},
  "Strategy #3":{cls:"gold", hue:HUE.gold},
};
const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];

/* ================= money / dates ================= */
function money(n){
  const neg=n<0, v=Math.abs(n);
  const s=(v%1===0)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?"-$":"$")+s;
}
function signed(n){ return (n>0?"+":n<0?"":"")+money(n); }
function moneyK(n){ const a=Math.abs(n); if(a>=1000) return (n<0?"-$":"$")+(a/1000).toFixed(1)+"k"; return money(n); }
function pctOf(n){ const c=Number(state.settings.startingCapital)||0; return c>0 ? n/c*100 : 0; }
function fmtPct(n){ return (n>0?"+":"")+n.toFixed(2)+"%"; }
function cls(n){ return n>0?"pos":n<0?"neg":""; }
function iso(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDateLong(s){ const d=parseISO(s);
  return d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }

/* ================= derived math ================= */
function acctContracts(t,k){ const o=t.ov&&t.ov[k]; return (o!=null&&o!=="")?Number(o):Number(t.contracts||0); }
function acctPnl(t,k){ return t.accts[k] ? Number(t.points||0)*acctContracts(t,k)*MULT : 0; }
function totalPnl(t){ return ACCTS.reduce((s,a)=>s+acctPnl(t,a.k),0); }
function acctComm(t,k){
  if(!t.accts[k]) return 0;
  if(t.imported) return (Number(t.fees)||0)+(Number(t.comm)||0); // real cost from the export (per trade)
  return ((ACCTS.find(a=>a.k===k)||{}).rt||0) * acctContracts(t,k);  // round-turn × contracts
}
function tradeComm(t){ return ACCTS.reduce((s,a)=>s+acctComm(t,a.k),0); }
function tradeNet(t){ return totalPnl(t)-tradeComm(t); }
function sortedTrades(){
  return [...state.trades].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.seq-b.seq));
}
function curAcct(){ return (state.ui&&state.ui.fAcct)||"all"; }
function curRange(){ return (state.ui&&state.ui.fRange)||"all"; }
function inRange(dateStr){
  const r=curRange(); if(r==="all") return true;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=parseISO(dateStr);
  if(r==="week"){ const ws=new Date(today); ws.setDate(today.getDate()-today.getDay()); return d>=ws; }
  if(r==="month"){ return d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth(); }
  if(r==="30d"){ const s=new Date(today); s.setDate(today.getDate()-29); return d>=s; }
  return true;
}
function visibleTrades(){
  const a=curAcct();
  return sortedTrades().filter(t=> (a==="all"||t.accts[a]) && inRange(t.date));
}
function vPnl(t){ const a=curAcct(); return a==="all"?totalPnl(t):acctPnl(t,a); }
function vComm(t){ const a=curAcct(); return a==="all"?tradeComm(t):acctComm(t,a); }
function vNet(t){ return vPnl(t)-vComm(t); }
function withEquity(){ let run=0; return visibleTrades().map(t=>{ run+=vPnl(t); return {t,equity:run}; }); }

/* ================= state + storage (IndexedDB, graceful) ================= */
let state = {trades:[], days:{}, ui:{tab:"chart", calY:2026, calM:1, jDate:null, fAcct:"all", fRange:"all"}, settings:{lastContracts:4, startingCapital:150000}};
let idb=null, memoryOnly=false, saveTimer=null;

function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open("mnq-journal",1);
      r.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); };
      r.onsuccess=e=>res(e.target.result);
      r.onerror=()=>{ memoryOnly=true; res(null); };
    }catch(e){ memoryOnly=true; res(null); }
  });
}
function dbGet(){ return new Promise(res=>{ if(!idb) return res(null);
  try{ const tx=idb.transaction("kv","readonly").objectStore("kv").get("state");
    tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);
  }catch(e){res(null);} }); }
function dbPut(v){ return new Promise(res=>{ if(!idb) return res();
  try{ const tx=idb.transaction("kv","readwrite").objectStore("kv").put(v,"state");
    tx.onsuccess=()=>res(); tx.onerror=()=>res();
  }catch(e){res();} }); }
function persist(){ if(memoryOnly) return; clearTimeout(saveTimer); saveTimer=setTimeout(()=>dbPut(state),250); }

/* ================= sample data (matches the Notion build, Feb 2026) ================= */
function sample(){
  const A=(ts1,ts2,apex)=>({ts1,ts2,apex});
  const rows=[
    ["2026-02-01","Long","WIN",1,4, 29,A(1,1,1),1,"A+ opening drive, trend continuation off VWAP reclaim"],
    ["2026-02-02","Long","WIN",3,3, 5.5,A(1,1,1),1,"Small scalp, took partials early, left a runner"],
    ["2026-02-03","Short","LOSS",1,4,-18,A(1,1,1),1,"Faded a breakout that held, stopped for full risk"],
    ["2026-02-04","Long","WIN",1,5, 31,A(1,1,1),1,"Clean trend day, added on pullback, held to target"],
    ["2026-02-05","Long","WIN",3,3, 9,A(1,1,1),1,"Range reversal at demand, quick in and out"],
    ["2026-02-06","Short","LOSS",2,4,-22,A(1,1,1),0,"Chased the short late, gave back the gain — revenge entry"],
    ["2026-02-07","Long","WIN",3,4, 21,A(1,1,1),1,"Patience paid off, waited for the retest"],
    ["2026-02-08","Long","WIN",1,5, 24,A(1,1,1),1,"Mechanical trend grind, steady adds"],
    ["2026-02-09","Short","LOSS",3,4,-23,A(1,1,1),0,"Wrong side of the open, cut it — no real setup"],
    ["2026-02-10","Long","WIN",2,3, 5,A(1,1,1),1,"Base breakout, tight stop, small win"],
    ["2026-02-11","Short","LOSS",1,4,-9,A(1,1,1),1,"Small loss, respected the stop, moved on"],
    ["2026-02-12","Long","WIN",1,3, 14,A(1,1,1),1,"Reduced size, textbook entry"],
    ["2026-02-13","Long","WIN",1,4, 22,A(1,1,1),1,"Best setup of the week, full conviction"],
    ["2026-02-14","Long","WIN",3,5, 25,A(1,1,1),1,"Momentum continuation, scaled out into strength"],
    ["2026-02-15","Long","WIN",1,2, 6,A(1,1,1),1,"Low volatility, took what the market gave"],
    ["2026-02-16","Short","LOSS",1,5,-19,A(1,1,0),0,"Oversized B-setup, biggest loss — Apex sat out to protect trailing drawdown"],
    ["2026-02-17","Long","WIN",2,4, 7,A(1,1,1),1,"Reversal off the lows, clean execution"],
    ["2026-02-18","Long","WIN",1,5, 41,A(1,1,1),1,"Trade of the month, trend day, held the whole leg"],
    ["2026-02-19","Long","WIN",3,5, 33,A(1,1,1),1,"Followed the plan exactly, zero deviations"],
  ];
  return rows.map((r,i)=>({
    id:"s"+(i+1), seq:i, date:r[0], dir:r[1], outcome:r[2],
    strategy:"Strategy #"+r[3], contracts:r[4], points:r[5],
    accts:{ts1:!!r[6].ts1,ts2:!!r[6].ts2,apex:!!r[6].apex}, ov:{},
    rules:!!r[7], notes:r[8], images:[]
  }));
}

/* ================= tabs ================= */
const TABS=[
  {k:"chart",    label:"Dashboard",         icon:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {k:"journal",  label:"Journal",           icon:'<path d="M5 4h11l4 4v12H5z"/><path d="M8 10h8M8 14h8M8 18h5"/>'},
  {k:"list",     label:"List overview",     icon:'<path d="M4 6h16M4 12h16M4 18h16"/>'},
  {k:"wins",     label:"Wins vs Losses",    icon:'<rect x="4" y="4" width="7" height="16" rx="1"/><rect x="13" y="4" width="7" height="16" rx="1"/>'},
  {k:"strategy", label:"Strategy overview", icon:'<rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><rect x="16" y="4" width="4.5" height="16" rx="1"/>'},
  {k:"calendar", label:"Calendar",          icon:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/>'},
  {k:"gallery",  label:"Gallery",           icon:'<rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M4 16l4-3 4 3 3-2 5 4"/>'},
];
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab ${state.ui.tab===t.k?'active':''}" data-k="${t.k}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>${t.label}</button>`).join("");
  $$("#tabs .tab").forEach(b=>b.onclick=()=>{ state.ui.tab=b.dataset.k; persist(); renderTabs(); render(); });
}

function stratPill(s){ return `<span class="pill ${STRATS[s].cls}">${s}</span>`; }
function dirPill(d){ return `<span class="pill ${d==='Long'?'blue':'orange'}">${d}</span>`; }

    <th><span class="hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>Outcome</span></th>
    <th><span class="hd">Direction</span></th>
    <th><span class="hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16"/></svg>Date</span></th>

      <td>${stratPill(t.strategy)}</td>

      <td class="num ${cls(acctPnl(t,'ts1'))}" style="text-align:right">${money(acctPnl(t,'ts1'))}</td>
      <td class="num ${cls(acctPnl(t,'ts2'))}" style="text-align:right">${money(acctPnl(t,'ts2'))}</td>
      <td class="num ${cls(acctPnl(t,'apex'))}" style="text-align:right">${money(acctPnl(t,'apex'))}</td>
      <td style="text-align:right"><div class="num ${cls(tp)}" style="font-weight:600">${money(tp)}</div><div class="num" style="color:var(--text-faint);font-size:11px">${fmtPct(pctOf(tp))}</div></td>

/* ================= VIEW: boards ================= */
function board(groups){
  return `<div class="board">`+groups.map(g=>{
    const sum=g.items.reduce((s,t)=>s+vPnl(t),0);
    const cards=g.items.map(t=>{
      const cover=t.images[0];
      return `<div class="card" data-id="${t.id}">
        ${cover?`<img class="cover" src="${cover}" alt="">`:''}
        <div class="r"><span class="name">MNQ</span>${outcomePill(t.outcome)}${dirPill(t.dir)}</div>
        <div class="r"><span class="meta">${fmtDateLong(t.date)}</span><span class="meta num ${cls(vPnl(t))}" style="margin-left:auto;font-weight:600">${money(vPnl(t))} <span style="color:var(--text-faint);font-weight:400">${fmtPct(pctOf(vPnl(t)))}</span></span></div>
      </div>`;}).join("")||`<div class="meta" style="color:var(--text-faint);padding:6px 2px">No trades</div>`;
    return `<div class="bcol">
      <div class="bcol-h">${g.head}<span class="count">${g.items.length}</span><span class="sum num ${cls(sum)}">${money(sum)}</span></div>
      ${cards}</div>`;
  }).join("")+`</div>`;
}
function viewWins(){
  if(!state.trades.length) return emptyState();
  const g=o=>({head:outcomePill(o),items:visibleTrades().filter(t=>t.outcome===o)});
  return board([g("WIN"),g("LOSS")]);
}
function viewStrategy(){
  if(!state.trades.length) return emptyState();
  const g=s=>({head:stratPill(s),items:visibleTrades().filter(t=>t.strategy===s)});
  return board(Object.keys(STRATS).map(g));
}

/* ================= VIEW: calendar ================= */
function viewCalendar(){
  const y=state.ui.calY, m=state.ui.calM;
  const monthName=new Date(y,m,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const byDate={}; visibleTrades().forEach(t=>{ (byDate[t.date]=byDate[t.date]||[]).push(t); });
  const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="wd">${d}</div>`).join("");
  let cells="";
  const total=Math.ceil((first+days)/7)*7;
  for(let i=0;i<total;i++){
    const dnum=i-first+1;
    if(dnum<1||dnum>days){ cells+=`<div class="cell out"></div>`; continue; }
    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dnum).padStart(2,"0")}`;
    const dayTrades=byDate[ds]||[];
    if(!dayTrades.length){ cells+=`<div class="cell empty" data-date="${ds}"><span class="dn num">${dnum}</span></div>`; continue; }
    const net=dayTrades.reduce((s,t)=>s+vPnl(t),0);
    const k=net>=0?"green":"red", nt=dayTrades.length;
    cells+=`<div class="cell ${k}" data-date="${ds}">
      <span class="dn num">${dnum}</span>
      <div class="daybody">
        <div class="amt num ${cls(net)}">${signed(net)}</div>
        <div class="sub num">${fmtPct(pctOf(net))} · ${nt} trade${nt>1?"s":""}</div>
      </div></div>`;
  }
  return `<div class="cal-h">
      <div class="nav"><button data-nav="-1">‹</button><button data-nav="1">›</button></div>
      <div class="m">${monthName}</div>
      <button class="today-btn" data-nav="today">Today</button>
    </div>
    <div class="cal"><div class="wkhdr">${wd}</div><div class="grid">${cells}</div></div>`;
}

/* ================= Journal (day document) ================= */
function uid(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dayObj(date){ if(!state.days[date]) state.days[date]={blocks:[]}; return state.days[date]; }
function jDate(){ return state.ui.jDate || iso(new Date()); }
function tradeById(id){ return state.trades.find(t=>t.id===id); }
function tradeNumber(id){ const s=sortedTrades(); const i=s.findIndex(t=>t.id===id); return i<0?"":"#"+(i+1); }
const EMOJIS=["🎯","😎","😐","😤","😨","🤢","🤞","😴","🧊","🔥"];
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function opt(arr,sel){ return arr.map(o=>`<option ${o===sel?"selected":""}>${o}</option>`).join(""); }
function findBlock(bid){ const d=state.days[jDate()]; return d&&(d.blocks||[]).find(b=>b.id===bid); }
function autoGrow(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight)+"px"; }

function migrateToDays(){
  if(state.days && Object.keys(state.days).length) return;
  state.days={};
  sortedTrades().forEach(t=>{
    const d=dayObj(t.date);
    d.blocks.push({id:uid(),type:"trade",tradeId:t.id});
    (t.images||[]).forEach(src=>d.blocks.push({id:uid(),type:"image",src}));
    t.images=[];
  });
}
function allImageBlocks(){
  const out=[];
  Object.keys(state.days).sort().reverse().forEach(date=>{
    (state.days[date].blocks||[]).forEach(b=>{ if(b.type==="image") out.push({date,id:b.id,src:b.src}); });
  });
  return out;
}
function newJournalTrade(date){
  return { id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), seq:state.trades.length,
    date, dir:"Long", outcome:"WIN", strategy:"Strategy #1", contracts:1, points:0,
    accts:{ts1:true,ts2:false,apex:false}, ov:{}, rules:true, notes:"",
    pnl:null, time:"", duration:"", immediate:false, emoji:"", images:[] };
}

function renderBlock(b){

    return `<div class="jblock" data-bid="${b.id}"><button class="bdel" data-bdel="${b.id}">✕</button>
      <img class="jimg" src="${b.src}" alt="" data-bimg="${b.id}"></div>`;

    const t=tradeById(b.tradeId); if(!t) return "";
    return `<div class="jblock" data-bid="${b.id}"><div class="jtstrip" data-tid="${t.id}">
      <span class="tnum">${tradeNumber(t.id)}</span>

      <input class="ti qty num" data-f="qty" inputmode="numeric" placeholder="×1" value="${t.contracts||1}" title="Contracts">
      <label class="imm" title="Went my way immediately"><input type="checkbox" data-f="immediate" ${t.immediate?"checked":""}> →</label>
      <select class="ti ls" data-f="dir">${opt(["Long","Short"],t.dir)}</select>
      <input class="ti dur" data-f="duration" placeholder="dur" value="${escapeHtml(t.duration||"")}">
      <select class="ti strat" data-f="strategy">${Object.keys(STRATS).map(sName=>`<option value="${sName}" ${t.strategy===sName?"selected":""}>${sName.replace("Strategy ","")}</option>`).join("")}</select>
      <select class="ti acct" data-f="acct">${ACCTS.map(a=>`<option value="${a.k}" ${t.accts[a.k]?"selected":""}>${a.name.replace("TopstepX","TS")}</option>`).join("")}</select>
      <select class="ti emo" data-f="emoji">${["",...EMOJIS].map(e=>`<option ${t.emoji===e?"selected":""}>${e||"·"}</option>`).join("")}</select>
      <button class="del" data-tdel="${t.id}" data-tbid="${b.id}">🗑</button>

function jAdd(kind){
  const d=dayObj(jDate());
  if(kind==="text"){ const b={id:uid(),type:"text",text:""}; d.blocks.push(b); persist(); render();
    setTimeout(()=>{ const ta=document.querySelector(`[data-btext="${b.id}"]`); if(ta)ta.focus(); },0); return; }
  if(kind==="image"){ $("#j-img-input").click(); return; }
  if(kind==="trade"){ const t=newJournalTrade(jDate()); state.trades.push(t);
    d.blocks.push({id:uid(),type:"trade",tradeId:t.id}); persist(); render(); }
}
function editStrip(tid, field, el){
  const t=tradeById(tid); if(!t) return;
  if(field==="time") t.time=el.value;
  else if(field==="duration") t.duration=el.value;
  else if(field==="outcome") t.outcome=el.value;
  else if(field==="dir") t.dir=el.value;
  else if(field==="immediate") t.immediate=el.checked;
  else if(field==="emoji") t.emoji=(el.value==="·"?"":el.value);
  else if(field==="acct"){ t.accts={ts1:false,ts2:false,apex:false}; t.accts[el.value]=true; }
  else if(field==="strategy"){ t.strategy=el.value; }
  else if(field==="qty"){ t.contracts=Math.max(1,parseInt(el.value)||1); if(t.pnl!=null) t.points=t.pnl/((t.contracts||1)*MULT); }
  else if(field==="pnl"){
    const v=parseFloat(el.value); const c=Number(t.contracts)||1;
    t.pnl=isNaN(v)?null:v; t.points=isNaN(v)?0:(v/(c*MULT));
    if(!isNaN(v)&&v!==0){ t.outcome=v>0?"WIN":"LOSS"; const wl=el.closest(".jtstrip").querySelector('[data-f="outcome"]'); if(wl)wl.value=t.outcome; }
  }
  persist(); // no re-render: keeps focus while editing
}
function jDelBlock(bid){ const d=state.days[jDate()]; if(!d)return; d.blocks=(d.blocks||[]).filter(b=>b.id!==bid); persist(); render(); }
function jDelTrade(tid,bid){ state.trades=state.trades.filter(t=>t.id!==tid);
  const d=state.days[jDate()]; if(d) d.blocks=(d.blocks||[]).filter(b=>b.id!==bid); persist(); render(); }
function logTradeJournal(){
  state.ui.jDate=iso(new Date()); state.ui.tab="journal";
  const d=dayObj(jDate()); const t=newJournalTrade(jDate()); state.trades.push(t);
  d.blocks.push({id:uid(),type:"trade",tradeId:t.id});
  persist(); renderTabs(); render();
}
function openTradeInJournal(id){
  const t=tradeById(id); if(!t) return;
  state.ui.jDate=t.date; state.ui.tab="journal"; persist(); renderTabs(); render();
  setTimeout(()=>{ const strip=document.querySelector(`.jtstrip[data-tid="${id}"]`);
    if(strip){ strip.scrollIntoView({behavior:"smooth",block:"center"});
      strip.style.transition="box-shadow .25s"; strip.style.boxShadow="0 0 0 2px var(--accent)";
      setTimeout(()=>{ strip.style.boxShadow=""; },1300); } },70);
}
function syncTradeBlocks(){
  Object.keys(state.days).forEach(date=>{ const d=state.days[date];
    d.blocks=(d.blocks||[]).filter(b=> b.type!=="trade" || state.trades.some(t=>t.id===b.tradeId)); });
  const have=new Set();
  Object.values(state.days).forEach(d=>(d.blocks||[]).forEach(b=>{ if(b.type==="trade") have.add(b.tradeId); }));
  sortedTrades().forEach(t=>{ if(!have.has(t.id)){ dayObj(t.date).blocks.push({id:uid(),type:"trade",tradeId:t.id}); have.add(t.id); } });
}

/* ================= stats ================= */
function stats(){
  const ts=visibleTrades(), n=ts.length;
  const wins=ts.filter(t=>t.outcome==="WIN").length;
  const losses=ts.filter(t=>t.outcome==="LOSS").length;
  const rules=ts.filter(t=>t.rules).length;
  const byAcct={ts1:0,ts2:0,apex:0}, byAcctNet={ts1:0,ts2:0,apex:0}; let gross=0, comm=0;
  ts.forEach(t=>{ ACCTS.forEach(a=>{ byAcct[a.k]+=acctPnl(t,a.k); byAcctNet[a.k]+=acctPnl(t,a.k)-acctComm(t,a.k); }); gross+=vPnl(t); comm+=vComm(t); });
  const net=gross-comm;
  const byStrat={}; Object.keys(STRATS).forEach(s=>byStrat[s]=0);
  ts.forEach(t=>{ if(byStrat[t.strategy]==null)byStrat[t.strategy]=0; byStrat[t.strategy]+=vPnl(t); });
  const pnls=ts.map(vPnl);
  const winP=pnls.filter(v=>v>0), lossP=pnls.filter(v=>v<0);
  const grossWin=winP.reduce((a,b)=>a+b,0), grossLoss=Math.abs(lossP.reduce((a,b)=>a+b,0));
  const avgWin=winP.length?grossWin/winP.length:0, avgLoss=lossP.length?grossLoss/lossP.length:0;
  const profitFactor=grossLoss>0?grossWin/grossLoss:(grossWin>0?Infinity:0);
  const expectancyR=avgLoss>0?(gross/(n||1))/avgLoss:0;
  const best=pnls.length?Math.max(...pnls):0, worst=pnls.length?Math.min(...pnls):0;
  const cap=Number(state.settings.startingCapital)||0;
  let peak=cap,maxDD=0;
  withEquity().forEach(d=>{ const bal=cap+d.equity; if(bal>peak)peak=bal; const dd=peak>0?(peak-bal)/peak*100:0; if(dd>maxDD)maxDD=dd; });
  return {n,wins,losses,rules,gross,comm,net,byAcct,byAcctNet,byStrat,grossWin,grossLoss,avgWin,avgLoss,profitFactor,expectancyR,best,worst,maxDD,cap,
    currentBalance:cap+net, totalReturn:cap>0?net/cap*100:0,
    winRate:n?Math.round(wins/n*100):0, lossRate:n?Math.round(losses/n*100):0, rulesRate:n?Math.round(rules/n*100):0};
}

/* ================= charts (hand-drawn SVG) ================= */
function ring(pct,color,center,cap){
  const r=52,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(100,pct))/100);
  const long=String(center).length>4;
  const tl=long?' textLength="88" lengthAdjust="spacingAndGlyphs"':'';
  const fs=long?22:25;
  return `<div class="ring-card">
    <svg viewBox="0 0 120 120" width="120" height="120">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"
        style="transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.3,1)"/>
      <text x="60" y="60" text-anchor="middle" dominant-baseline="central" fill="#fff"
        font-size="${fs}" font-weight="700"${tl}>${center}</text>
    </svg>
    <div class="cap">${cap}</div></div>`;
}
function vbars(data){ // [{label,value,color}]
  const max=Math.max(1,...data.map(d=>Math.abs(d.value)));
  return `<div class="vbars">`+data.map(d=>{
    const h=Math.max(2,Math.abs(d.value)/max*140);
    return `<div class="vbar"><div class="track">
      <span class="val num ${cls(d.value)}">${money(d.value)}</span>
      <div class="fill" style="height:${h}px;background:${d.color}"></div>
    </div><div class="lab">${d.label}</div></div>`;
  }).join("")+`</div>`;
}
function hbars(data){ // [{label,value}]
  const max=Math.max(1,...data.map(d=>Math.abs(d.value)));
  return `<div class="hbars">`+data.map(d=>{
    const w=Math.abs(d.value)/max*50;
    const bar=d.value>=0
      ? `<div class="b" style="left:50%;width:${w}%;background:${HUE.green}"></div>`
      : `<div class="b" style="right:50%;width:${w}%;background:${HUE.red}"></div>`;
    return `<div class="hrow"><span class="d">${d.label}</span><div class="hbar">${bar}</div><span class="v"><span class="num ${cls(d.value)}">${signed(d.value)}</span><span class="vp num">${fmtPct(pctOf(d.value))}</span></span></div>`;
  }).join("")+`</div>`;
}
function equityLine(){
  const data=withEquity(); if(data.length<1) return `<div class="empty">Log trades to build your equity curve.</div>`;
  const W=760,H=230,pl=34,pr=46,pt=20,pb=24;
  const n=data.length;
  const xs=data.map((_,i)=>n===1?W/2:(pl+(W-pl-pr)*i/(n-1)));
  const ys=data.map(d=>d.equity);
  const min=Math.min(0,...ys), max=Math.max(0,...ys), span=(max-min)||1;
  const Y=v=>pt+(H-pt-pb)*(1-(v-min)/span);
  const pts=xs.map((x,i)=>`${x.toFixed(1)},${Y(ys[i]).toFixed(1)}`);
  const line=pts.join(" ");
  const area=`${xs[0]},${Y(min)} ${line} ${xs[xs.length-1]},${Y(min)}`;
  const zeroY=Y(0);
  const dots=xs.map((x,i)=>{
    const y=Y(ys[i]);
    let lab="";
    if(i===0||i===n-1){
      const anchor=i===0?"start":"end";
      const lx=i===0?x-2:x+2;
      const ly=Math.max(10,y-8);
      lab=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" fill="rgba(255,255,255,.5)" font-size="9">${money(ys[i])}</text>`;
    }
    return `<circle cx="${x}" cy="${y}" r="${i===n-1?2.8:1.8}" fill="#529bff"/>${lab}`;
  }).join("");
  return `<div class="linewrap"><svg class="line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="eg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#529bff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#529bff" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W-pr}" y1="${zeroY}" y2="${zeroY}" stroke="rgba(255,255,255,.094)" stroke-width="1"/>
    <polygon points="${area}" fill="url(#eg)"/>
    <polyline points="${line}" fill="none" stroke="#529bff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg></div>`;
}

function addFiles(files){
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{
    const rd=new FileReader();

  });

function downscale(dataUrl,cb){
  const img=new Image();
  img.onload=()=>{
    let{width:w,height:h}=img;
    const MAXPX=5000000; // ~5MP — keeps ultrawide / extended-monitor screenshots sharp
    const px=w*h;
    if(px>MAXPX){ const r=Math.sqrt(MAXPX/px); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    try{ cb(c.toDataURL("image/jpeg",0.9)); }catch(e){ cb(dataUrl); }
  };
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}

/* ============ TopstepX CSV import ============ */
function splitCSVLine(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch===','){out.push(cur);cur="";} else if(ch==='"'){q=true;} else cur+=ch; }
  }
  out.push(cur); return out;
}
function parseDT(s){ // "08/07/2026 08:44:59 -07:00"
  const parts=(s||"").trim().split(/\s+/);
  const dp=(parts[0]||"").split("/");
  if(dp.length<3) return {date:iso(new Date()),time:""};
  const [mm,dd,yyyy]=dp;
  return {date:`${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`, time:(parts[1]||"").slice(0,5)};
}
function instrumentRoot(c){ return ((c||"").replace(/[FGHJKMNQUVXZ]\d+$/,"")||"MNQ"); }
function fmtDur(s){ // "00:01:13.6800880" -> "1m 13s"
  const m=(s||"").match(/(\d+):(\d+):(\d+)/); if(!m) return s||"";
  const h=+m[1],mi=+m[2],se=+m[3];
  return (h?h+"h ":"")+(mi?mi+"m ":"")+se+"s";
}
function parseTopstepCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const H=splitCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
  const col=n=>H.indexOf(n.toLowerCase());
  const iP=col("PnL"), iEnter=col("EnteredAt"), iExit=col("ExitedAt"), iType=col("Type"),
        iSize=col("Size"), iC=col("ContractName"), iFee=col("Fees"), iCom=col("Commissions"),
        iEP=col("EntryPrice"), iXP=col("ExitPrice"), iDur=col("TradeDuration"), iId=col("Id");
  if(iP<0||iEnter<0||iType<0) return null; // not a TopstepX trades export
  const out=[];
  for(let r=1;r<lines.length;r++){
    const c=splitCSVLine(lines[r]); if(c.length<H.length) continue;
    const pnl=parseFloat(c[iP]); if(isNaN(pnl)) continue;
    const size=parseInt(c[iSize])||1;
    const en=parseDT(c[iEnter]);
    out.push({ id:(c[iId]||"").trim(), date:en.date, time:en.time,
      dir:/short/i.test(c[iType])?"Short":"Long", size, pnl,
      fees:parseFloat(c[iFee])||0, comm:parseFloat(c[iCom])||0,
      entryPrice:parseFloat(c[iEP])||null, exitPrice:parseFloat(c[iXP])||null,
      duration:fmtDur(c[iDur]), instrument:instrumentRoot(c[iC]) });
  }
  return out;
}
function acctName(k){ return (ACCTS.find(a=>a.k===k)||{}).name||k; }
function mapImported(p, acct, i){
  const accts={ts1:false,ts2:false,apex:false}; accts[acct]=true;
  const pts = p.size ? p.pnl/(p.size*MULT) : 0; // MNQ-equivalent points so P&L reproduces exactly
  return { id:"imp"+(p.id||(Date.now()+"_"+i)), seq:i, date:p.date, dir:p.dir,
    outcome:p.pnl>=0?"WIN":"LOSS", strategy:"Strategy #1", contracts:p.size, points:pts,
    accts, ov:{}, rules:true, notes:"Imported"+(p.time?" · "+p.time:""), images:[],
    imported:true, time:p.time, duration:p.duration, fees:p.fees, comm:p.comm,
    entryPrice:p.entryPrice, exitPrice:p.exitPrice, instrument:p.instrument, realPnl:p.pnl };
}
function handleCSVImport(text){
  const acct=$("#import-acct").value||"ts1";
  const parsed=parseTopstepCSV(text);
  if(parsed===null){ toast("Doesn't look like a TopstepX trades export"); return; }
  if(!parsed.length){ toast("No trades found in that file"); return; }
  const replace=state.trades.length ? confirm(`Import ${parsed.length} trades into ${acctName(acct)}.\n\nOK = replace the trades you have now.\nCancel = add these to them.`) : false;
  const mapped=parsed.map((p,i)=>mapImported(p,acct,i));
  state.trades = replace ? mapped : state.trades.concat(mapped);
  state.trades.forEach((t,i)=>t.seq=i);
  syncTradeBlocks();
  persist(); render(); toast(`Imported ${parsed.length} trades → ${acctName(acct)}`);
}

/* ================= boot ================= */
(async function(){
  idb=await openDB();
  const saved=await dbGet();
  if(saved&&Array.isArray(saved.trades)){ state=Object.assign(state,saved); state.ui=saved.ui||state.ui;
    state.settings=Object.assign({lastContracts:4,startingCapital:150000}, saved.settings||{}); }
  else{ state.trades=sample(); }
  state.settings.accounts=Object.assign(JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)), state.settings.accounts||{});
  state.days=state.days||{};
  migrateToDays();
  syncTradeBlocks();
  state.ui.jDate=state.ui.jDate||iso(new Date());
  await dbPut(state);
  renderTabs(); render();
})();
</script>
